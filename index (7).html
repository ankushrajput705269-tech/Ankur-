<title>Starfall Archers</title>
<style>
/* Layout: one 16:9 stage centered in the viewport; canvas draws the arena, DOM overlays hold menus and the shop. */
:root{
  --bg:#050816; --ink:#e8f0ff; --dim:#8fa3d6; --line:rgba(120,160,255,.28);
  --cyan:#52e5ff; --orange:#ff8a3d; --green:#36ff8c; --pink:#ff3d6e; --gold:#ffd23f;
  --panel:rgba(7,12,38,.9);
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --body:'Rajdhani','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;overflow:hidden;height:100%;width:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#0c1440,#030512 70%)}
#stage{position:relative;box-shadow:0 0 60px rgba(70,120,255,.25);border-radius:6px;overflow:hidden;background:#050816}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5}
.ov.on{display:flex}
#menu{background:linear-gradient(180deg,rgba(3,6,24,.35),rgba(3,6,24,.78))}
#between{align-items:flex-end;padding-bottom:9em;pointer-events:none}
#between .panel{pointer-events:auto}
#shop,#over,#pause{background:rgba(3,6,20,.82);backdrop-filter:blur(5px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:1.1em;padding:1.8em 2.4em;text-align:center;max-width:94%;max-height:92%;overflow:auto;box-shadow:0 0 3em rgba(40,90,255,.18)}
h1,h2{font-family:var(--display);margin:0;font-weight:400;letter-spacing:.04em;line-height:1}
h1{font-size:4.6em}
h1 .a{color:var(--orange);text-shadow:0 0 .35em rgba(255,120,40,.7)}
h1 .b{display:block;color:var(--cyan);text-shadow:0 0 .35em rgba(70,220,255,.65);font-size:.8em;letter-spacing:.14em}
h2{font-size:2.4em}
.tag{color:var(--dim);font-size:1.25em;margin:.9em 0 1.4em;letter-spacing:.05em}
.stats{display:flex;gap:1.6em;justify-content:center;flex-wrap:wrap;margin:1.2em 0 1.6em;font-size:1.15em;color:var(--dim)}
.stats b{color:var(--ink);font-size:1.3em;display:block;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:.8em;justify-content:center;flex-wrap:wrap}
.btn{font:700 1.15em var(--body);letter-spacing:.1em;text-transform:uppercase;color:#fff;padding:.65em 1.5em;border-radius:.6em;border:1px solid var(--line);background:rgba(40,60,130,.55);cursor:pointer;transition:transform .12s,filter .12s}
.btn:hover:not(:disabled){filter:brightness(1.25);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#ffa458,#ff5a2a);border-color:#ffb27a;box-shadow:0 0 1.2em rgba(255,110,40,.5);font-size:1.4em}
.btn.sm{font-size:1em;padding:.45em .9em;min-width:5.2em}
.hint{margin-top:1.3em;color:var(--dim);font-size:1em;line-height:1.5}
.hint kbd{font:inherit;border:1px solid var(--line);border-radius:.3em;padding:0 .4em;color:var(--ink)}
.coin{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffb800 60%,#b57600);margin-right:.35em;vertical-align:-.05em}
.shopwrap{width:62em;max-width:100%}
.shophead{display:flex;justify-content:space-between;align-items:center;gap:1em;margin-bottom:1em}
.shophead .gold{font-size:1.6em;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.4em;text-align:left}
.cols h3{margin:0 0 .6em;font-size:1em;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.row{display:grid;grid-template-columns:2.9em 1fr auto;gap:.8em;align-items:center;padding:.55em .7em;border:1px solid var(--line);border-radius:.7em;margin-bottom:.55em;background:rgba(20,30,80,.35)}
.row .ic{width:2.9em;height:2.9em;border-radius:.6em;display:grid;place-items:center;font:700 .85em var(--body);letter-spacing:.04em;color:#06101e;background:var(--c)}
.row .tx{min-width:0}
.row .tx b{display:block;font-size:1.1em;letter-spacing:.04em}
.row .tx span{display:block;color:var(--dim);font-size:.9em;line-height:1.25}
.pips{display:flex;gap:.2em;margin-top:.25em}

.pips i.on{background:var(--cyan);box-shadow:0 0 .4em var(--cyan)}
.owned{color:var(--green);font-weight:700;letter-spacing:.08em;font-size:.95em;padding:0 .6em}
#hb{position:absolute;top:3.7em;right:1em;display:none;gap:.5em;z-index:4}
#hb.on{display:flex}
#hb .btn{padding:.3em .7em;font-size:.95em}
#rot{display:none;position:fixed;left:0;right:0;bottom:12px;text-align:center;color:var(--dim);font-size:15px;padding:0 16px}

#sys{position:absolute;bottom:.6em;right:.8em;display:flex;gap:.4em;z-index:6;opacity:.8}#sys .btn{font-size:.8em;padding:.3em .7em;min-width:0}
#fb{position:absolute;right:.8em;bottom:3.4em;display:none;flex-direction:column;gap:.5em;z-index:6;touch-action:none}#fb.on{display:flex}#mb{position:absolute;left:.8em;bottom:.6em;display:none;gap:.5em;z-index:6;touch-action:none}#mb.on{display:flex}#fb .btn,#mb .btn{touch-action:none;padding:.7em 1.1em;font-size:1em;background:rgba(40,110,170,.7)}#fb .btn.hold{background:rgba(82,229,255,.55)}
.row .ic svg{width:72%;height:72%;display:block}
#fb #tbtn{background:rgba(120,60,200,.78);font-size:.85em;letter-spacing:.04em}#fb #tbtn.cool{opacity:.5}
.row.tech{border-color:rgba(82,229,255,.45);box-shadow:inset 0 0 16px rgba(82,229,255,.09)}.row.tech .lv{color:#8fd0ff;font-weight:700;margin-left:.5em}
#toast{position:absolute;top:16%;left:50%;transform:translateX(-50%);background:rgba(255,61,110,.92);color:#fff;padding:.5em 1.2em;border-radius:2em;font-weight:700;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
.panel{touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.row.eq{border-color:var(--green);box-shadow:0 0 1em rgba(54,255,140,.3)}.btn.poor{opacity:.55}
#intro{position:absolute;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 55%,#10206a,#02030c 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s;overflow:hidden}#intro.out{opacity:0;pointer-events:none}
#intro .st{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 80px,#9cf,transparent),radial-gradient(2px 2px at 150px 20px,#fff,transparent);background-size:180px 120px;animation:drift 25s linear infinite;opacity:.8}@keyframes drift{to{background-position:-180px -120px}}
#intro .sweep{position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(100deg,transparent,rgba(120,200,255,.28),transparent);transform:skewX(-18deg)}#intro.go .sweep{animation:sw 2s 1.1s ease-in-out forwards}@keyframes sw{to{left:120%}}
#intro .lg{position:relative;text-align:center;font:900 4.6em/1 var(--display);opacity:0;color:#dff6ff;text-shadow:0 0 .3em #52e5ff,0 0 .9em #2a7bff}#intro .lg b{display:block;color:#ff8a3d;text-shadow:0 0 .3em #ff8a3d,0 0 .9em #ff3d6e}
#intro.go .lg{animation:lgin 1.8s .3s cubic-bezier(.2,.8,.2,1) forwards}@keyframes lgin{from{opacity:0;transform:scale(1.7);filter:blur(14px);letter-spacing:.4em}to{opacity:1;transform:none;filter:none;letter-spacing:.04em}}
#intro .dev{margin-top:1.6em;font:700 1.5em var(--body);letter-spacing:.35em;color:#cfe6ff;opacity:0}#intro .dev em{font-style:normal;color:#ffd23f;text-shadow:0 0 .5em #ffd23f,0 0 1.2em #ff8a3d}
#intro.go .dev{animation:dv 1.4s 2.2s forwards,gl 1.6s 3.4s infinite alternate}@keyframes dv{from{opacity:0;transform:translateY(1em)}to{opacity:1;transform:none}}@keyframes gl{to{text-shadow:0 0 1em #fff}}
#entbtn{position:relative;margin-top:2em;animation:bl 1.4s infinite alternate}#intro.go #entbtn{display:none}@keyframes bl{to{opacity:.45}}
#between{align-items:center;padding-bottom:0}
#shop,#over,#pause,#map{background:rgba(3,6,20,.86)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.55em}
.lv{font:600 1em var(--body);color:var(--ink);background:rgba(30,45,110,.7);border:1px solid var(--line);border-radius:.7em;padding:.4em .2em;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:0}
.lv b{font-size:1.5em}.lv span{font-size:.8em;color:var(--dim);line-height:1.1}.lv i{font-style:normal;color:var(--gold);font-size:.85em}
.lv.now{border-color:var(--orange);box-shadow:0 0 1em rgba(255,120,40,.6)}.lv:disabled{opacity:.35;cursor:default}
.stars{color:var(--gold);font-size:2em;letter-spacing:.2em;line-height:1.1}
.pk-t{margin:.8em 0 .5em;color:var(--dim);letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.pk{display:flex;gap:.7em;justify-content:center}
.card{flex:1;min-width:0;max-width:13em;font:600 1em var(--body);color:var(--ink);background:rgba(25,35,90,.8);border:2px solid var(--c);border-radius:.8em;padding:.7em .6em;cursor:pointer;display:flex;flex-direction:column;gap:.35em;align-items:center}
.card b{font-size:1.2em;color:var(--c)}.card span{line-height:1.2}.card i{font-style:normal;font-size:.8em;color:var(--dim)}
.card.sel{background:rgba(70,100,200,.75);box-shadow:0 0 1.4em var(--c)}.card:disabled{opacity:.3}
.mis{margin:.2em auto 1em;max-width:30em;text-align:left}.mis h4{margin:0 0 .3em;color:var(--dim);letter-spacing:.18em;text-transform:uppercase;font-size:.85em}
.mis div{display:flex;gap:.8em;padding:.15em 0;border-bottom:1px solid var(--line)}.mis div>span{flex:1}.mis em{font-style:normal;color:var(--cyan)}.mis strong{color:var(--gold)}
#between .stats{margin:.7em 0}#between .mis{margin-top:.8em}
@media (max-height:480px){#menu h1{font-size:2.8em}#menu .tag,#menu .hint{display:none}#menu .stats{margin:.5em 0}.mis{font-size:.9em}#between h2{font-size:1.6em}#between .stats{display:none}.card{padding:.4em}.pk-t{margin:.4em 0}}
@media (max-height:480px){.panel{padding:.8em 1em}.row{padding:.35em .5em;margin-bottom:.35em}}
@media (max-width:760px){.cols{grid-template-columns:1fr}.panel{padding:1.2em 1.2em}h1{font-size:3.4em}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div id="wrap">
  <div id="stage">
    <canvas id="c" aria-label="Starfall Archers game"></canvas>
    <div id="hb"><button class="btn" data-act="pause" aria-label="Pause">II</button><button class="btn" data-act="menu" aria-label="Home">&#8962; Home</button></div>
    <div id="sys"><button class="btn sm" data-act="sound" id="sndbtn">Sound</button><button class="btn sm" data-act="music" id="musbtn">Music</button><button class="btn sm" data-act="fs">Fullscreen</button></div>
    <div id="fb"><button class="btn" id="tbtn" style="display:none" aria-label="Teleport">&#9889; TELEPORT</button><button class="btn" id="fup" aria-label="Fly up">&#9650; FLY</button><button class="btn" id="fdn" aria-label="Fly down">&#9660;</button></div>
    <div id="mb"><button class="btn" id="mlf" aria-label="Move left">&#9664;</button><button class="btn" id="mrt" aria-label="Move right">&#9654;</button></div>

    <div class="ov on" id="menu">
      <div class="panel">

    <div class="ov" id="between">
      <div class="panel" id="betweenp"></div>

    <div class="ov" id="over">

    <div class="ov" id="pause">

          <button class="btn primary" data-act="resume">Resume</button>

<script>
(()=>{
'use strict';
let W=1280,OX=0;const H=720,TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const cv=$('c'),ctx=cv.getContext('2d'),stage=$('stage'),wrap=$('wrap');
let SC=1,rotated=false;

/* ---------- save ---------- */
const KEY='starfall-archers-v1';
const save={coins:0,up:{dmg:0,hp:0,armor:0,helm:0,draw:0,aim:0},unlocked:{normal:1,fire:1},bestWave:0,bestKills:0,sound:1,music:1,sel:'normal',bows:{classic:1},bow:'classic',cp:1};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){save.coins=s.coins|0;Object.assign(save.up,s.up||{});Object.assign(save.unlocked,s.unlocked||{});save.bestWave=s.bestWave|0;save.bestKills=s.bestKills|0;save.sound=s.sound===0?0:1;save.music=s.music===0?0:1;Object.assign(save.bows,s.bows||{});if(typeof s.bow==='string')save.bow=s.bow;save.cp=Math.min(500,Math.max(1,s.cp|0));if(typeof s.sel==='string')save.sel=s.sel;}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}

/* ---------- data ---------- */
save.perks={};save.missions=[];save.mdone=0;
try{const s3=JSON.parse(localStorage.getItem(KEY)||'null');if(s3){Object.assign(save.perks,s3.perks||{});if(Array.isArray(s3.missions))save.missions=s3.missions.filter(m=>m&&m.goal>0).slice(0,3);save.mdone=s3.mdone|0;}}catch(e){}
const UPS=[
 {k:'dmg',name:'Arrow Damage',tag:'DMG',desc:'+20% damage on every arrow',base:150,col:'#ff8a3d'},
 {k:'hp',name:'Vitality',tag:'HP',desc:'+25 maximum health',base:120,col:'#ff5577'},
 {k:'armor',name:'Armor',tag:'ARM',desc:'Take 6% less damage',base:140,col:'#36ff8c'},
 {k:'helm',name:'Helmet',tag:'HLM',desc:'Headshots hurt you less',base:160,col:'#b0c4ff'},
 {k:'draw',name:'Bow Power',tag:'PWR',desc:'Faster arrows, longer range',base:130,col:'#ffd23f'},
 {k:'aim',name:'Aim Assist',tag:'AIM',desc:'Longer trajectory preview',base:100,col:'#52e5ff'}
];
const AT=[
 {id:'normal',name:'Standard',col:'#d6ff7a',cd:0,cost:0,desc:'Reliable and unlimited.'},
 {id:'fire',name:'Fire',col:'#ff8a2b',cd:4,cost:0,desc:'Sets targets ablaze.'},
 {id:'ice',name:'Frost',col:'#66e3ff',cd:5,cost:700,desc:'Freezes. Enemies shoot slower.'},
 {id:'triple',name:'Triple',col:'#ffd84a',cd:6,cost:1100,desc:'Three arrows in a fan.'},
 {id:'bomb',name:'Blast',col:'#ff4d78',cd:8,cost:1600,desc:'Explodes. Smashes crates.'},
 {id:'homing',name:'Seeker',col:'#c07bff',cd:7,cost:2200,desc:'Curves toward enemies.'},
 {id:'bolt',name:'Storm',col:'#7aa8ff',cd:9,cost:3000,desc:'Chains lightning between enemies.'}
];
AT.forEach(a=>{a.cd=0;}); // once unlocked, arrows stay usable forever: no cooldown timers
const BOWS=[
 {id:'classic',name:'Classic Bow',col:'#ffc14d',cost:0,dm:1,spd:1,rl:1,kh:0,desc:'Balanced starter bow.'},
 {id:'plasma',name:'Plasma Bow',col:'#52e5ff',cost:1200,dm:1,spd:1.08,rl:.75,kh:0,desc:'Fast draw: 25% quicker reload, faster arrows.'},
 {id:'crimson',name:'Crimson Bow',col:'#ff4d6d',cost:2500,dm:1.25,spd:1,rl:1,kh:0,desc:'+25% arrow damage.'},
 {id:'nova',name:'Nova Bow',col:'#7dff9a',cost:4000,dm:1.1,spd:1,rl:.9,kh:30,desc:'Life-link: +30 extra HP per kill, +10% damage.'},
 {id:'solar',name:'Solar Bow',col:'#ffd23f',cost:6500,dm:1.35,spd:1.12,rl:.85,kh:0,desc:'+35% damage, faster arrows and reload.'},
 {id:'void',name:'Void Bow',col:'#c07bff',cost:10000,dm:1.5,spd:1.15,rl:.75,kh:30,desc:'+50% damage, quick draw, +30 HP per kill.'},
 {id:'rail',name:'Rail Crossbow',col:'#9dff1a',cost:3200,dm:1.15,spd:1.55,rl:1.15,kh:0,gs:.3,desc:'Super fast, almost flat shots. Little arrow drop.'},
 {id:'ballista',name:'Ballista',col:'#ff9a3d',cost:7500,dm:2,spd:1.2,rl:1.6,kh:0,gs:.7,pierce:1,desc:'+100% damage. Arrows pierce through one enemy. Slow reload.'}
];
const curBow=()=>BOWS.find(b=>b.id===save.bow&&save.bows[b.id])||BOWS[0];
const upCost=u=>Math.round(u.base*Math.pow(1.5,save.up[u.k])/5)*5;
const maxHP=()=>100+25*save.up.hp;
save.tech={shield:0,repair:0,plasma:0,drone:0,revive:0,tele:0};
try{const s2=JSON.parse(localStorage.getItem(KEY)||'null');if(s2&&s2.tech)for(const k in save.tech)save.tech[k]=Math.max(0,Math.min(10,s2.tech[k]|0));}catch(e){}
const TECH=[
 {k:'shield',name:'Energy Shield',max:10,base:350,g:1.55,col:'#52e5ff',desc:'Regenerating barrier that absorbs damage. +20 shield per level.'},
 {k:'repair',name:'Nano Repair',max:10,base:400,g:1.55,col:'#36ff8c',desc:'Heals you over time when not hit for 3s. Faster each level.'},
 {k:'plasma',name:'Plasma Armor',max:10,base:450,g:1.55,col:'#7aa8ff',desc:'Take 4% less damage per level, on top of Armor.'},
 {k:'drone',name:'Guard Drone',max:10,base:700,g:1.6,col:'#ffd23f',desc:'Drone shoots down incoming arrows. Reloads faster each level.'},
 {k:'revive',name:'Revive Core',max:3,base:1500,g:2.2,col:'#ff5a8a',desc:'Come back from death once per run per level, with half health and a shockwave.'},
 {k:'tele',name:'Quantum Teleport',max:5,base:800,g:1.9,col:'#c07bff',desc:'Blink away from danger (button or T key). Lv3: EMP wipes arrows. Lv5: blast hits enemies.'}
];
const techCost=t=>Math.round(t.base*Math.pow(t.g,save.tech[t.k])/5)*5;
const teleCD=()=>13-2*save.tech.tele;
const GRAV=900,WINDF=120;

/* ---------- audio ---------- */

    if(a.t==='homing'&&a.own==='p'){const tg=nearestEnemy(a.x,a.y);if(tg){const want=Math.atan2(cheatY(tg)-a.y,tg.x-a.x);let cur=Math.atan2(a.vy,a.vx),d=want-cur;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;const s=Math.hypot(a.vx,a.vy);cur+=clamp(d,-3.4*h,3.4*h);a.vx=Math.cos(cur)*s;a.vy=Math.sin(cur)*s;g=GRAV*.15;}}
    if(a.homing&&a.own==='e'&&a.vx<0&&a.x-PX>60){const t=(PX-a.x)/a.vx,pred=a.y+a.vy*t+.5*g*t*t;a.vy+=clamp((py()-45-pred)/t,-300,300)*h*1.6;}

  if(a.t==='fire'&&Math.random()<.8)P(a.x,a.y,rnd(-30,30),rnd(-40,10),.4,7,'#ff7a2a',-60,0);
  else if(a.t==='ice')P(a.x+rnd(-4,4),a.y+rnd(-4,4),rnd(-20,20),rnd(-20,20),.4,4,'#aaf4ff',0,0);

  else if(a.t==='bolt'&&Math.random()<.5)P(a.x+rnd(-6,6),a.y+rnd(-6,6),rnd(-40,40),rnd(-40,40),.2,4,'#bfe0ff',0,0);

/* ---------- update / render ---------- */
function update(rdt){
  const dt=rdt*ts;
  T+=rdt;
  if(slowT>0){slowT-=rdt;ts=.3;}else ts=1;
  if(shake>0)shake=Math.max(0,shake-rdt*40);
  if(hurtFlash>0)hurtFlash-=rdt;
  pbob=Math.sin(T*1.1)*3;
  if(!G)return;
  if(state==='play'&&!G.dead){
    if(fly.fuel>0&&fly.up){fly.y=Math.max(-FLYMAX,fly.y-300*rdt);fly.fuel-=34*rdt;}
    else if(fly.down){fly.y=Math.min(0,fly.y+300*rdt);}
    else if(fly.y<0){if(fly.fuel>0)fly.fuel-=6*rdt;else fly.y=Math.min(0,fly.y+220*rdt);}
    if(fly.y>=0&&!fly.up)fly.fuel=Math.min(100,fly.fuel+40*rdt);
    fly.fuel=clamp(fly.fuel,0,100);
    statusTick(rdt);
    pvx=((fly.r?1:0)-(fly.l?1:0))*240*(G.chillT>0?.45:1);PX+=pvx*rdt;
    if(fly.y>-30){const c=clamp(PX,PHOME-95,PHOME+95);PX+=clamp(c-PX,-300*rdt,300*rdt);}else PX=clamp(PX,70,400);
    if(G.hp<=50&&G.hp>1){G.hp=Math.max(1,G.hp-1.25*dt);G.burning=true;if(Math.random()<.55)P(PX+rnd(-9,9),py()-rnd(8,84),rnd(-16,16),-rnd(40,95),.5,6,'#ff7a2a',-80,0);if(Math.random()<.2)P(PX+rnd(-6,6),py()-rnd(30,90),rnd(-10,10),-rnd(60,110),.45,4,'#ffd23f',-80,0);}else G.burning=false;
    techTick(rdt,dt);
    if(G.hp<maxHP()*.3&&!G.lowE){G.lowE=1;emoteP('😰',1.8);}if(G.hp>maxHP()*.5)G.lowE=0;
  }else{fly.up=fly.down=fly.l=fly.r=false;pvx=0;G.burning=false;fly.y=Math.min(0,fly.y+400*rdt);PX+=clamp(PHOME-PX,-260*rdt,260*rdt);}
  if(pem)pem.t-=rdt;for(const e of enemies)if(e.em)e.em.t-=rdt;if(fin.t>0)fin.t-=rdt;
  if(G.banner)G.banner.t+=rdt;
  if(state==='play'||state==='between'){
    if(G.reload>0)G.reload-=dt;
    for(const k in G.cd)if(G.cd[k]>0)G.cd[k]-=dt;
    for(const e of enemies)updateEnemy(e,dt);

  rotated=ph>pw*1.08;

  const asp=clamp(aw/ah,16/9,2.6),nW=Math.round(H*asp);

  let w=aw,h=aw/asp;if(h>ah){h=ah;w=ah*asp;}
  w=Math.floor(w);h=Math.floor(h);
  stage.style.width=w+'px';stage.style.height=h+'px';
  if(rotated){stage.style.position='absolute';stage.style.left=((pw-w)/2)+'px';stage.style.top=((ph-h)/2)+'px';stage.style.transform='rotate(90deg)';stage.style.borderRadius='0';stage.style.boxShadow='none';}

}

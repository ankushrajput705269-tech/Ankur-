<style>
/* Layout: one 16:9 stage centered in the viewport; canvas draws the arena, DOM overlays hold menus and the shop. */
:root{
  --bg:#050816; --ink:#e8f0ff; --dim:#8fa3d6; --line:rgba(120,160,255,.28);

}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

.ov.on{display:flex}
#menu{background:linear-gradient(180deg,rgba(3,6,24,.35),rgba(3,6,24,.78))}

#intro .sweep{position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(100deg,transparent,rgba(120,200,255,.28),transparent);transform:skewX(-18deg)}#intro.go .sweep{animation:sw 2s 1.1s ease-in-out forwards}@keyframes sw{to{left:120%}}
#intro .lg{position:relative;text-align:center;font:900 4.6em/1 var(--display);opacity:0;color:#dff6ff;text-shadow:0 0 .3em #52e5ff,0 0 .9em #2a7bff}#intro .lg b{display:block;color:#ff8a3d;text-shadow:0 0 .3em #ff8a3d,0 0 .9em #ff3d6e}
#intro.go .lg{animation:lgin 1.8s .3s cubic-bezier(.2,.8,.2,1) forwards}@keyframes lgin{from{opacity:0;transform:scale(1.7);filter:blur(14px);letter-spacing:.4em}to{opacity:1;transform:none;filter:none;letter-spacing:.04em}}
#intro .dev{margin-top:1.6em;font:700 1.5em var(--body);letter-spacing:.35em;color:#cfe6ff;opacity:0}#intro .dev em{font-style:normal;color:#ffd23f;text-shadow:0 0 .5em #ffd23f,0 0 1.2em #ff8a3d}
#intro.go .dev{animation:dv 1.4s 2.2s forwards,gl 1.6s 3.4s infinite alternate}@keyframes dv{from{opacity:0;transform:translateY(1em)}to{opacity:1;transform:none}}@keyframes gl{to{text-shadow:0 0 1em #fff}}
#entbtn{position:relative;margin-top:2em;animation:bl 1.4s infinite alternate}#intro.go #entbtn{display:none}@keyframes bl{to{opacity:.45}}
@media (max-height:480px){.panel{padding:.8em 1em}.row{padding:.35em .5em;margin-bottom:.35em}}

<script>
(()=>{

/* ---------- data ---------- */
const UPS=[
 {k:'dmg',name:'Arrow Damage',tag:'DMG',desc:'+20% damage on every arrow',base:150,col:'#ff8a3d'},
 {k:'hp',name:'Vitality',tag:'HP',desc:'+25 maximum health',base:120,col:'#ff5577'},

 {k:'draw',name:'Bow Power',tag:'PWR',desc:'Faster arrows, longer range',base:130,col:'#ffd23f'},
 {k:'aim',name:'Aim Assist',tag:'AIM',desc:'Longer trajectory preview',base:100,col:'#52e5ff'}
];
const AT=[
 {id:'normal',name:'Standard',col:'#d6ff7a',cd:0,cost:0,desc:'Reliable and unlimited.'},
 {id:'fire',name:'Fire',col:'#ff8a2b',cd:4,cost:0,desc:'Sets targets ablaze.'},
 {id:'ice',name:'Frost',col:'#66e3ff',cd:5,cost:700,desc:'Freezes. Enemies shoot slower.'},
 {id:'triple',name:'Triple',col:'#ffd84a',cd:6,cost:1100,desc:'Three arrows in a fan.'},
 {id:'bomb',name:'Blast',col:'#ff4d78',cd:8,cost:1600,desc:'Explodes. Smashes crates.'},

 {id:'classic',name:'Classic Bow',col:'#ffc14d',cost:0,dm:1,spd:1,rl:1,kh:0,desc:'Balanced starter bow.'},
 {id:'plasma',name:'Plasma Bow',col:'#52e5ff',cost:1200,dm:1,spd:1.08,rl:.75,kh:0,desc:'Fast draw: 25% quicker reload, faster arrows.'},
 {id:'crimson',name:'Crimson Bow',col:'#ff4d6d',cost:2500,dm:1.25,spd:1,rl:1,kh:0,desc:'+25% arrow damage.'},
 {id:'nova',name:'Nova Bow',col:'#7dff9a',cost:4000,dm:1.1,spd:1,rl:.9,kh:30,desc:'Life-link: +30 extra HP per kill, +10% damage.'},
 {id:'solar',name:'Solar Bow',col:'#ffd23f',cost:6500,dm:1.35,spd:1.12,rl:.85,kh:0,desc:'+35% damage, faster arrows and reload.'},
 {id:'void',name:'Void Bow',col:'#c07bff',cost:10000,dm:1.5,spd:1.15,rl:.75,kh:30,desc:'+50% damage, quick draw, +30 HP per kill.'},
 {id:'rail',name:'Rail Crossbow',col:'#9dff1a',cost:3200,dm:1.15,spd:1.55,rl:1.15,kh:0,gs:.3,desc:'Super fast, almost flat shots. Little arrow drop.'},
 {id:'ballista',name:'Ballista',col:'#ff9a3d',cost:7500,dm:2,spd:1.2,rl:1.6,kh:0,gs:.7,pierce:1,desc:'+100% damage. Arrows pierce through one enemy. Slow reload.'}

const curBow=()=>BOWS.find(b=>b.id===save.bow&&save.bows[b.id])||BOWS[0];
const upCost=u=>Math.round(u.base*Math.pow(1.5,save.up[u.k])/5)*5;

const GRAV=900,WINDF=120;

/* ---------- audio ---------- */
let AC=null,noiseBuf=null,SFXG=null,MUSG=null,MBUS=null,musicOn=false,mTimer=null,mNext=0,mStep=0;
function unlockAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();SFXG=AC.createGain();SFXG.connect(AC.destination);MUSG=AC.createGain();MUSG.gain.value=0;MUSG.connect(AC.destination);MBUS=AC.createGain();MBUS.connect(MUSG);const dl=AC.createDelay(1);dl.delayTime.value=.42;const fb=AC.createGain();fb.gain.value=.32;MBUS.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(MUSG);const n=AC.sampleRate*1;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();

  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);

  s.connect(f);f.connect(g);g.connect(SFXG);s.start(t);s.stop(t+dur);

const sfx={
  shoot(){tone(620,160,.14,'triangle',.13);noise(.07,.1,3000,'highpass');},
  eshoot(){tone(420,120,.16,'triangle',.07);},
  hit(){tone(240,70,.13,'square',.09);noise(.08,.12,1200);},

const CH=[[57,60,64,67],[53,57,60,64],[55,59,62,66],[52,55,59,62]],mf=n=>440*Math.pow(2,(n-69)/12);

function solve(dx,up,v){ // low-arc angle to hit target dx ahead, up above start
  const v2=v*v,d=v2*v2-GRAV*(GRAV*dx*dx+2*up*v2);if(d<0)return null;

  const def=AT.find(a=>a.id===t);
  return {x,y,vx,vy,own,t,dmg,age:0,dead:false,stuck:0,trail:[],col:own==='p'?def.col:'#ff7aa8'};
}
function stickArrow(a,t){a.stuck=t;a.vx=a.vy=0;a.trail.length=0;burst(a.x,a.y,'#b9c8ff',4,70,2.5,.3,150);}
function nearestEnemy(x,y){let b=null,bd=1e9;for(const e of enemies){if(e.dead||e.spawn<1)continue;const d=Math.hypot(e.x-x,cheatY(e)-y);if(d<bd){bd=d;b=e;}}return b;}
function islands(){const l=[{x:PHOME,w:PISL,top:baseY()}];for(const e of enemies)if(!e.dead&&e.spawn>.5)l.push({x:e.x,w:e.iw,top:e.ey});return l;}

function hitTest(a){
  const x=a.x,y=a.y;
  if(x<-140||x>W+140||y>H+140||y<-800){a.dead=true;return true;}
  for(const o of obst){if(o.hp>0&&x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h){
    if(a.t==='bomb')explode(x,y,95,a.dmg*1.2);else{hitObst(o,a.dmg);sfx.hit();stickArrow(a,1.2);}
    if(a.t==='bomb')a.dead=true;return true;}}
  for(const i of islands()){if(x>i.x-i.w/2&&x<i.x+i.w/2&&y>i.top+2&&y<i.top+30){
    if(a.t==='bomb'){explode(x,y,95,a.dmg*1.2);a.dead=true;}else stickArrow(a,1.4);return true;}}
  if(a.own==='p'){
    for(const e of enemies){
      if(e.dead||e.spawn<1)continue;if(a.hit&&a.hit.includes(e))continue;const s=e.s,ey=e.ey;
      if(e.sh>0){const bx=e.x,by=ey-46*s,r=60*s;if((x-bx)*(x-bx)+(y-by)*(y-by)<r*r){
        if(a.t==='bomb')explode(x,y,95,a.dmg*1.2);else{const t=Math.min(e.sh,a.dmg);e.sh-=t;ring(x,y,'#52e5ff',20,10);sfx.shield();text(x,y-14,Math.round(t),'#7af0ff',18,.6);if(e.sh<=0){popShield(e);}}
        a.dead=true;return true;}}
      const hx=e.x,hy=ey-84*s;
      if((x-hx)*(x-hx)+(y-hy)*(y-hy)<(15*s)*(15*s)){hitEnemy(e,a,true);return true;}
      if(x>e.x-12*s&&x<e.x+12*s&&y>ey-72*s&&y<ey){hitEnemy(e,a,false);return true;}
    }
  }else if(!G.dead){
    const p=py(),hy=p-86;
    if((x-PX)*(x-PX)+(y-hy)*(y-hy)<15*15){hurtPlayer(a.dmg,true);a.dead=true;return true;}
    if(x>PX-13&&x<PX+13&&y>p-74&&y<p){hurtPlayer(a.dmg,false);a.dead=true;return true;}
  }
  return false;
}
function hitEnemy(e,a,head){
  if(a.pierce>0&&a.t!=='bomb'){a.pierce--;(a.hit||(a.hit=[])).push(e);}else a.dead=true;
  if(a.t==='bomb'){explode(a.x,a.y,95,a.dmg*1.2);return;}
  const dmg=a.dmg*(head?2:1);
  burst(a.x,a.y,head?'#ff5577':'#ffffff',head?16:9,head?300:200,4,.35,200);
  head?sfx.head():sfx.hit();if(head){shake=Math.max(shake,6);slowT=Math.max(slowT,.12);}
  if(a.t==='fire'){e.burn=3.2;sfx.hit();}
  if(a.t==='ice'){e.frozen=3.5;burst(a.x,a.y,'#9ef0ff',22,260,5,.6,0);sfx.ice();}
  damageEnemy(e,dmg,head);
  if(a.t==='bolt'&&!e.dead)chain(e,a.dmg*.7,'#7aa8ff');
  else if(a.t==='bolt')chain(e,a.dmg*.7,'#7aa8ff');
}
function hurtPlayer(dmg,head){
  const armor=Math.max(.35,1-.06*save.up.armor),hm=head?Math.max(1,2-.1*save.up.helm):1,d=Math.round(dmg*armor*hm);
  G.hp-=d;hurtFlash=.5;shake=Math.max(shake,head?13:8);sfx.hurt();
  emoteP(head?'😵':'😣',1.2);{const fl=enemies.filter(x=>!x.dead&&x.spawn>=1);if(fl.length)emoteE(fl[Math.floor(Math.random()*fl.length)],'😈',1.3);}
  text(PX+rnd(-10,10),py()-110,'-'+d,'#ff5577',28,.9);burst(PX,py()-60,'#ff5577',18,260,5,.5,300);
  if(head)text(PX,py()-140,'HEADSHOT','#ff5577',18,.9);
  if(G.hp<=0){G.hp=0;G.dead=true;G.overT=1.6;slowT=.9;sfx.die();
    corpses.push({x:PX,y:py()-40,vx:-120,vy:-260,rot:0,vr:-4,col:'#ff8a3d',s:1,l:2.5});burst(PX,py()-50,'#ff8a3d',40,380,7,1,400);}
}
function stepArrow(a,dt){
  if(a.stuck>0){a.stuck-=dt;if(a.stuck<=0)a.dead=true;return;}
  const sp=Math.hypot(a.vx,a.vy),n=Math.max(1,Math.ceil(sp*dt/7)),h=dt/n;
  for(let i=0;i<n;i++){
    let g=GRAV*(a.gs||1);
    if(a.t==='homing'&&a.own==='p'){const tg=nearestEnemy(a.x,a.y);if(tg){const want=Math.atan2(cheatY(tg)-a.y,tg.x-a.x);let cur=Math.atan2(a.vy,a.vx),d=want-cur;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;const s=Math.hypot(a.vx,a.vy);cur+=clamp(d,-3.4*h,3.4*h);a.vx=Math.cos(cur)*s;a.vy=Math.sin(cur)*s;g=GRAV*.15;}}
    a.vx+=wind*WINDF*h;a.vy+=g*h;a.x+=a.vx*h;a.y+=a.vy*h;a.age+=h;
    if(hitTest(a))break;
  }
  if(a.dead||a.stuck>0)return;
  a.trail.push(a.x,a.y);if(a.trail.length>28)a.trail.splice(0,2);
  if(a.t==='fire'&&Math.random()<.8)P(a.x,a.y,rnd(-30,30),rnd(-40,10),.4,7,'#ff7a2a',-60,0);
  else if(a.t==='ice')P(a.x+rnd(-4,4),a.y+rnd(-4,4),rnd(-20,20),rnd(-20,20),.4,4,'#aaf4ff',0,0);
  else if(a.t==='homing')P(a.x,a.y,rnd(-20,20),rnd(-20,20),.45,5,'#c07bff',0,0);
  else if(a.t==='bolt'&&Math.random()<.5)P(a.x+rnd(-6,6),a.y+rnd(-6,6),rnd(-40,40),rnd(-40,40),.2,4,'#bfe0ff',0,0);
  else if(a.t==='bomb'&&Math.random()<.5)P(a.x,a.y,rnd(-20,20),rnd(-20,20),.3,6,'#ff4d78',0,0);
}

const inp={down:false,ax:0,ay:0,cx:0,cy:0};
function aimVec(){const vx=inp.ax-inp.cx,vy=inp.ay-inp.cy,l=Math.hypot(vx,vy);if(l<22)return null;let dx=vx/l,dy=vy/l;if(dx<.1){dx=.1;const m=Math.hypot(dx,dy);dx/=m;dy/=m;}return{dx,dy,p:clamp(l/170,0,1)};}
function fire(){
  const a=aimVec();inp.down=false;if(!a||G.dead||G.reload>0)return;
  const id=AT[G.sel].id,v=arrowSpeed(a.p)*curBow().spd,dmg=34*(1+.2*save.up.dmg)*curBow().dm,sx=PX+a.dx*34,sy=py()-64+a.dy*34;
  const mk=(ang,m)=>{const c=Math.cos(ang),s=Math.sin(ang);const ar=mkArrow('p',id,sx,sy,c*v,s*v,dmg*m);ar.gs=curBow().gs||1;ar.pierce=curBow().pierce||0;arrows.push(ar);};
  const base=Math.atan2(a.dy,a.dx);
  if(id==='triple'){mk(base-.09,.7);mk(base,.7);mk(base+.09,.7);}else mk(base,id==='fire'?.9:1);
  if(id!=='normal'){G.cd[id]=AT[G.sel].cd;G.sel=0;}
  G.reload=.42*curBow().rl;G.shots++;sfx.shoot();shake=Math.max(shake,2);
  burst(sx,sy,'#ffffff',5,120,3,.2,0);
}

/* ---------- update / render ---------- */
function update(rdt){
  const dt=rdt*ts;
  T+=rdt;
  if(slowT>0){slowT-=rdt;ts=.3;}else ts=1;
  if(shake>0)shake=Math.max(0,shake-rdt*40);
  if(hurtFlash>0)hurtFlash-=rdt;
  pbob=Math.sin(T*1.1)*3;
  if(!G)return;
  if(state==='play'&&!G.dead){
    if(fly.fuel>0&&fly.up){fly.y=Math.max(-FLYMAX,fly.y-300*rdt);fly.fuel-=34*rdt;}
    else if(fly.down){fly.y=Math.min(0,fly.y+300*rdt);}
    else if(fly.y<0){if(fly.fuel>0)fly.fuel-=6*rdt;else fly.y=Math.min(0,fly.y+220*rdt);}
    if(fly.y>=0&&!fly.up)fly.fuel=Math.min(100,fly.fuel+40*rdt);
    fly.fuel=clamp(fly.fuel,0,100);
    pvx=((fly.r?1:0)-(fly.l?1:0))*240;PX+=pvx*rdt;
    if(fly.y>-30){const c=clamp(PX,PHOME-95,PHOME+95);PX+=clamp(c-PX,-300*rdt,300*rdt);}else PX=clamp(PX,70,400);
    if(G.hp<=50&&G.hp>1){G.hp=Math.max(1,G.hp-1.25*dt);G.burning=true;if(Math.random()<.55)P(PX+rnd(-9,9),py()-rnd(8,84),rnd(-16,16),-rnd(40,95),.5,6,'#ff7a2a',-80,0);if(Math.random()<.2)P(PX+rnd(-6,6),py()-rnd(30,90),rnd(-10,10),-rnd(60,110),.45,4,'#ffd23f',-80,0);}else G.burning=false;
    if(G.hp<maxHP()*.3&&!G.lowE){G.lowE=1;emoteP('😰',1.8);}if(G.hp>maxHP()*.5)G.lowE=0;
  }else{fly.up=fly.down=fly.l=fly.r=false;pvx=0;G.burning=false;fly.y=Math.min(0,fly.y+400*rdt);PX+=clamp(PHOME-PX,-260*rdt,260*rdt);}
  if(pem)pem.t-=rdt;for(const e of enemies)if(e.em)e.em.t-=rdt;if(fin.t>0)fin.t-=rdt;
  if(G.banner)G.banner.t+=rdt;
  if(state==='play'||state==='between'){
    if(G.reload>0)G.reload-=dt;
    for(const k in G.cd)if(G.cd[k]>0)G.cd[k]-=dt;
    for(const e of enemies)updateEnemy(e,dt);
    for(const a of arrows)stepArrow(a,dt);
    for(let i=arrows.length-1;i>=0;i--)if(arrows[i].dead)arrows.splice(i,1);
    for(let i=enemies.length-1;i>=0;i--)if(enemies[i].dead&&T>0)enemies.splice(i,1);
    if(state==='play'&&!G.dead&&!G.cleared&&enemies.length===0&&G.banner&&G.banner.t>.5){
      G.cleared=true;G.clearT=1.2;const bonus=60+G.wave*15,heal=Math.round(maxHP()*.25);
      save.coins+=bonus;G.runCoins+=bonus;G.hp=Math.min(maxHP(),G.hp+heal);G.bonus=bonus;G.heal=heal;
      save.bestWave=Math.max(save.bestWave,G.wave);save.bestKills=Math.max(save.bestKills,G.kills);save.cp=Math.min(200,G.wave+1);persist();sfx.win();
      emoteP('🥳',2);text(W/2,260,'WAVE CLEARED','#52e5ff',44,1.4);
    }
    if(G.cleared&&state==='play'){G.clearT-=rdt;if(G.clearT<=0)showBetween();}
    if(G.dead&&state==='play'){G.overT-=rdt;if(G.overT<=0)showOver();}
  }
  for(const c of corpses){c.vy+=1100*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.rot+=c.vr*dt;c.l-=dt*.5;}
  for(let i=corpses.length-1;i>=0;i--)if(corpses[i].l<=0)corpses.splice(i,1);
  for(const p of parts){p.vx*=1-Math.min(1,p.d*dt);p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;}
  for(let i=parts.length-1;i>=0;i--)if(parts[i].l<=0)parts.splice(i,1);
  for(const t of texts){t.y-=40*rdt;t.l-=rdt;}
  for(let i=texts.length-1;i>=0;i--)if(texts[i].l<=0)texts.splice(i,1);
  for(const b of bolts)b.l-=rdt;
  for(let i=bolts.length-1;i>=0;i--)if(bolts[i].l<=0)bolts.splice(i,1);
}

  const ups=UPS.map(u=>{const l=save.up[u.k],mx=l>=10,c=upCost(u);return `<div class="row"><div class="ic" style="--c:${u.col}">${ico(u.k)}</div><div class="tx"><b>${u.name}</b><span>${u.desc}</span><div class="pips">${pips(l)}</div></div><button class="btn sm" data-act="up" data-arg="${u.k}" ${mx||save.coins<c?'disabled':''}>${mx?'MAX':'<span class="coin"></span>'+fmt(c)}</button></div>`;}).join('');

function act(a,arg){
  if(!['ar','up','eq','bb','eb'].includes(a))sfx.click();
  switch(a){
    case'play':newRun();state='play';paused=false;inp.down=false;show(null);break;
    case'next':startWave();state='play';show(null);break;
    case'shop':shopFrom=arg;renderShop();show('shop');break;
    case'back':if(shopFrom==='menu'){menuStats();show('menu');}else if(shopFrom==='between')show('between');else if(shopFrom==='over')show('over');else{show('pause');}if(shopFrom==='between'||shopFrom==='over'){} break;
    case'up':{const u=UPS.find(x=>x.k===arg),c=upCost(u);if(save.up[u.k]>=10)break;if(save.coins<c){poor();break;}save.coins-=c;save.up[u.k]++;if(u.k==='hp'&&G&&!G.dead)G.hp+=25;persist();sfx.up();renderShop();break;}
    case'ar':{const t=AT.find(x=>x.id===arg);if(!t||save.unlocked[arg])break;if(save.coins<t.cost){poor();break;}save.coins-=t.cost;save.unlocked[arg]=1;persist();sfx.unlock();renderShop();break;}
    case'coll':shopFrom='menu';renderShop();show('coll');break;
    case'bb':{const b=BOWS.find(x=>x.id===arg);if(!b||save.bows[arg])break;if(save.coins<b.cost){poor();break;}save.coins-=b.cost;save.bows[arg]=1;persist();sfx.unlock();renderShop();break;}
    case'eb':{if(save.bows[arg]){save.bow=arg;persist();sfx.equip();renderShop();}break;}
    case'fresh':{if(!act.f){act.f=1;toast('Tap again to restart from Wave 1');setTimeout(()=>act.f=0,2500);}else{act.f=0;save.cp=1;persist();menuStats();toast('Progress reset to Wave 1');}break;}
    case'eq':{if(save.unlocked[arg]){save.sel=arg;persist();sfx.equip();renderShop();}break;}
    case'menu':showMenu();break;
    case'pause':setPause(true);break;
    case'resume':setPause(false);break;
    case'sound':toggleSound();break;
